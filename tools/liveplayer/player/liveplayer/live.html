<!DOCTYPE HTML>
<html>
  <head>
    <title>liveplayer</title>
            <meta charset="utf-8">
                    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
                            <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
                            <script type="text/javascript" src="liveplayer-element.min.js"></script>
                                </head>
                                <body>
                                  <live-player id="player01" video-url="rtmp://127.0.0.1:11936/live/1" live="true" stretch="true"></live-player>
                                  <live-player video-url="http://127.0.0.1:11937/live/1.m3u8" live="true" stretch="true"></live-player>
                                  <live-player video-url="http://127.0.0.1:11938/live/1.flv" live="true" stretch="true"></live-player>
                                  
                                  <script>
                                // JavaScript 交互示例, 需要将页面代码放到 http web server 容器下, 通过浏览器 http 协议访问
                                var player = document.getElementById('player01');
player.addEventListener('snapOutside', evt => {
                  console.log('获取快照 base64 数据', evt.detail[0]);
              
});
setTimeout(() => {
                  console.log("快照, 回调 snapOutside...");
                  player.getVueInstance().snap();
                  console.log("静音...");
                  player.getVueInstance().setMuted(true);
                  console.log("静音状态: " + player.getVueInstance().getMuted());
                  console.log("暂停...");
                  player.getVueInstance().pause();
                  console.log("暂停状态: " + player.getVueInstance().paused());
              
}, 3000);
setTimeout(() => {
                  console.log("放音...");
                  player.getVueInstance().setMuted(false);
                  console.log("静音状态: " + player.getVueInstance().getMuted());
                  console.log("播放...");
                  player.getVueInstance().play();
                  console.log("暂停状态: " + player.getVueInstance().paused());
              
}, 6000);
setTimeout(() => {
                  console.log("切换媒体源...");
                  player.setAttribute("video-url", "rtmp://127.0.0.1:11936/live/1");
              
}, 9000);
                            </script>
                                </body>
</html>
</script></live-player></live-player></live-player></body></script></title></head></html>
