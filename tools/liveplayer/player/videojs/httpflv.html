<!DOCTYPE html>
<html lang="en">
<head>
    <title>video</title>
    <!-- Video.js -->
    <link href="https://unpkg.com/video.js/dist/video-js.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js/dist/video.min.js"></script>
    <script src="flv.js"></script>
    <script src="https://unpkg.com/videojs-flvjs/dist/videojs-flvjs.min.js"></script>
</head>
<body>
    <div>
	<video id="videojs-flvjs-player" class="video-js vjs-default-skin vjs-big-play-centered"  width="1024" height="768"> </video>
    </div>
</body>	 
</html>
	<script>
		var flvUrl = "http://127.0.0.1:11938/live/5021.flv";
		var player = videojs('videojs-flvjs-player', {
	    		techOrder: ['html5', 'flvjs'],
	    		flvjs: {
		            mediaDataSource: {
				    isLive: true,
				    cors: true,
				    withCredentials: false,
                    hasAudio: true,
                    hasVideo: true,
			    },
		        },
	    		sources: [{
		            src: flvUrl,
		            type: 'video/mp4'
		        }],
	    		controls: true,
	    		preload: "none"
			}, function onPlayerReady() {
	    			console.log('player ready')
	 
	    			player.on('error', (err) => {
		            		console.log('first source load fail')
		     
		            		player.src({
				                src: flvUrl,
				                type: 'video/x-flv'
				        });
		     
		            	player.ready(function() {
				        console.log('player ready')
				        player.load();
				        player.play();
					});
		        	})
			});
</script>
