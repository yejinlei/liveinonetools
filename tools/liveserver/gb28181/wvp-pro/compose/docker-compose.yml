version: '3'
services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis_default.conf
      - ./redis/data/:/data
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server /etc/redis/redis_default.conf --appendonly yes

  db:
    image: registry.cn-hangzhou.aliyuncs.com/hxdi/mysql:5.7
    container_name: mysql57
    privileged: true
    volumes:
      - ./mysql/my.cnf:/etc/my.cnf
      - ./mysql/volumes/conf:/etc/mysql/conf.d
      - ./mysql/volumes/logs/:/logs
      - ./mysql/volumes/data/:/var/lib/mysql
      #- "/etc/timezone:/etc/timezone:rw"
      #- "/etc/localtime:/etc/localtime:rw"
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8083:80"
    environment:
      - PMA_ARBITRARY=1
    links:
      - db
    depends_on:
      - db
    volumes:
      #- "/etc/timezone:/etc/timezone:rw"
      #- "/etc/localtime:/etc/localtime:rw"
      - /sessions

  zlm:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/zlmediakit:2ae97a6
    container_name: zlm
    ports:
      - "1935:1935"
      - "554:554"
      - "80:80"
      - "443:443"
      - "10000:10000"
      - "10000:10000/udp"
      - "8000:8000/udp"
      - "9000:9000/udp"
    volumes:
      - ./zlmediakit/config.ini:/opt/media/conf/config.ini

  wvp:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/wvp:2.0
    container_name: wvp
    ports:
      - "5060:5060"
      - "5060:5060/udp"
      - "18080:18080"
      - "80:80"
      - "10000:10000/tcp"
      - "10000:10000/udp"
      - "30000-30500:30000-30500/tcp"
      - "30000-30500:30000-30500/udp"
    volumes:
      - ./wvp/application-docker.yml:/opt/wvp/config/application.yml
      - ./wvp/application-dev.yml:/opt/assist/config/application.yml
      - ./wvp/video:/opt/media/www/record/
      - ./wvp/logs/wvp:/opt/wvp/logs/
      - ./wvp/logs/assist:/opt/assist/logs/
      - ./wvp/logs/media:/opt/media/log/
    environment:
      TZ: "Asia/Shanghai"
      # 用于替换/opt/wvp/config/application.yml中变量
      WVP_HOST: 10.13.2.15
      WVP_PWD: 12345678
      WVP_DOMAIN: 6101130049
      WVP_ID: 61011300490000000001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 6
      REDIS_PWD: root
      ASSIST_JVM_CONFIG: -Xms128m -Xmx256m
      WVP_JVM_CONFIG: -Xms128m -Xmx256m
      ASSIST_CONFIG:
      WVP_CONFIG:
      ZLM_HOST: zlm 
      ZLM_PORT: 80
    depends_on:
      - redis
      - db
      - zlm
