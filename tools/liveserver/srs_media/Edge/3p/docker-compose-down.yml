version: '3.5'
services:
  #下行边缘
  live_edge_down:
    hostname: edge_down
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-live:1.0.0
    ports:
      - "33935:1935"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./edge-down/edge.conf:/usr/local/srs/conf/edge.conf:ro
    networks:
      - live-network-3p
    deploy:
      mode: replicated
      replicas: 1
    command:
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/edge.conf
        ./server 8085                                                                                                                                                   


networks:
  live-network-3p:
    #driver: bridge
    external: true
