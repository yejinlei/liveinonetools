version: '3.5'
services:

  #源站节点
  live_origin:
    hostname: origin
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-live:1.0.0
    ports:
      - "32935:1935"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./edge-origin/origin.conf:/usr/local/srs/conf/origin.conf:ro
    networks:
      - live-network-origin
    deploy:
      mode: replicated
      replicas: 1
    command:
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/origin.conf
        ./server 8085

  live_edge_down_test:
    hostname: edge_down_test
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-live:1.0.0
    ports:
      - "33935:1935"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./edge-origin/edge.conf:/usr/local/srs/conf/edge.conf:ro
    networks:
      - live-network-origin
    deploy:
      mode: replicated
      replicas: 1
    command:
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/edge.conf
        ./server 8085       

networks:
  live-network-origin:
    driver: bridge
