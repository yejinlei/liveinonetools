apiVersion: v1
kind: DeploymentConfig
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: live-dvr
  name: live-dvr
spec:
  replicas: 1
  selector:
    io.kompose.service: live-dvr
  strategy:
    resources: {}
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/live-network: "true"
        io.kompose.service: live-dvr
    spec:
      containers:
        - args:
            - /bin/sh
            - -c
            - |
              objs/srs -c conf/rtmp2dvr.conf
              ./server 8085
          image: ' '
          name: live_dvr
          ports:
            - containerPort: 8180
          resources: {}
          volumeMounts:
            - mountPath: /usr/local/srs/objs/nginx/html
              name: live-dvr-claim0
            - mountPath: /etc/localtime
              name: live-dvr-claim1
              readOnly: true
            - mountPath: /usr/local/srs/conf/rtmp2dvr.conf
              name: live-dvr-claim2
              readOnly: true
      hostname: dvr
      restartPolicy: Always
      volumes:
        - name: live-dvr-claim0
          persistentVolumeClaim:
            claimName: live-dvr-claim0
        - name: live-dvr-claim1
          persistentVolumeClaim:
            claimName: live-dvr-claim1
            readOnly: true
        - name: live-dvr-claim2
          persistentVolumeClaim:
            claimName: live-dvr-claim2
            readOnly: true
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - live-dvr
        from:
          kind: ImageStreamTag
          name: live-dvr:1.0.0
      type: ImageChange
status:
  availableReplicas: 0
  latestVersion: 0
  observedGeneration: 0
  replicas: 0
  unavailableReplicas: 0
  updatedReplicas: 0
