apiVersion: v1
kind: DeploymentConfig
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: live-ingest
  name: live-ingest
spec:
  replicas: 1
  selector:
    io.kompose.service: live-ingest
  strategy:
    resources: {}
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/live-network: "true"
        io.kompose.service: live-ingest
    spec:
      containers:
        - args:
            - ./ingest
          env:
            - name: NODE_HOSTNAME
              value: "1"
            - name: SERVICE_NAME
              value: "1"
            - name: TASK_SLOT
              value: "1"
          image: ' '
          name: live_ingest
          resources: {}
          volumeMounts:
            - mountPath: /camera.conf
              name: live-ingest-claim0
              readOnly: true
            - mountPath: /argv.conf
              name: live-ingest-claim1
              readOnly: true
      hostname: ingest
      restartPolicy: Always
      volumes:
        - name: live-ingest-claim0
          persistentVolumeClaim:
            claimName: live-ingest-claim0
            readOnly: true
        - name: live-ingest-claim1
          persistentVolumeClaim:
            claimName: live-ingest-claim1
            readOnly: true
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - live-ingest
        from:
          kind: ImageStreamTag
          name: live-ingest:1.0.0
      type: ImageChange
status:
  availableReplicas: 0
  latestVersion: 0
  observedGeneration: 0
  replicas: 0
  unavailableReplicas: 0
  updatedReplicas: 0
