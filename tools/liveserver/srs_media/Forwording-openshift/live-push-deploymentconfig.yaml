apiVersion: v1
kind: DeploymentConfig
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: live-push
  name: live-push
spec:
  replicas: 1
  selector:
    io.kompose.service: live-push
  strategy:
    resources: {}
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/live-network: "true"
        io.kompose.service: live-push
    spec:
      containers:
        - image: ' '
          name: live_push
          resources: {}
          volumeMounts:
            - mountPath: /argv.conf
              name: live-push-claim0
              readOnly: true
            - mountPath: /camera.conf
              name: live-push-claim1
              readOnly: true
      hostname: push
      restartPolicy: Always
      volumes:
        - name: live-push-claim0
          persistentVolumeClaim:
            claimName: live-push-claim0
            readOnly: true
        - name: live-push-claim1
          persistentVolumeClaim:
            claimName: live-push-claim1
            readOnly: true
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - live-push
        from:
          kind: ImageStreamTag
          name: live-push:1.0.0
      type: ImageChange
status:
  availableReplicas: 0
  latestVersion: 0
  observedGeneration: 0
  replicas: 0
  unavailableReplicas: 0
  updatedReplicas: 0
