apiVersion: v1
kind: DeploymentConfig
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: live-webrtc
  name: live-webrtc
spec:
  replicas: 1
  selector:
    io.kompose.service: live-webrtc
  strategy:
    resources: {}
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/live-network: "true"
        io.kompose.service: live-webrtc
    spec:
      containers:
        - image: ' '
          name: live_webrtc
          ports:
            - containerPort: 8081
          resources: {}
          volumeMounts:
            - mountPath: /etc/localtime
              name: live-webrtc-claim0
              readOnly: true
            - mountPath: /app/config.json
              name: live-webrtc-claim1
              readOnly: true
      hostname: webrtc
      restartPolicy: Always
      volumes:
        - name: live-webrtc-claim0
          persistentVolumeClaim:
            claimName: live-webrtc-claim0
            readOnly: true
        - name: live-webrtc-claim1
          persistentVolumeClaim:
            claimName: live-webrtc-claim1
            readOnly: true
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - live-webrtc
        from:
          kind: ImageStreamTag
          name: live-webrtc:1.0.0
      type: ImageChange
status:
  availableReplicas: 0
  latestVersion: 0
  observedGeneration: 0
  replicas: 0
  unavailableReplicas: 0
  updatedReplicas: 0
