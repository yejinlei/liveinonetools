listen              1935;
max_connections     1000;
http_server {
    enabled         on;
    listen          8180;
    dir             ./objs/nginx/html;
    https {
        enabled on;
        listen 8088;
        key /etc/nginx/server.key;
        cert /etc/nginx/server.crt;
    }

}
vhost __defaultVhost__ {
    min_latency on;
    mr {
        enabled off;
        #latency 350;
    }
    mw_latency 100;
    gop_cache off;
    queue_length 10;
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;
    }
}

exporter {
    enabled         on;
    listen          9972;
    label           cn-beijing;
    tag             cn-edge;
}
