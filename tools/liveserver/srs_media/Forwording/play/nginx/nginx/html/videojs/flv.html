<head>
    <title>video</title>
    <!-- Video.js -->
    <link href="video-js.css" rel="stylesheet">
    <script src="video.min.js"></script>
    <script src="flv.min.js"></script>
    <script src="videojs-flvjs.min.js"></script>
</head>
<video id="videojs-flvjs-player" class="video-js vjs-default-skin" controls>
  <source src="http://127.0.0.1:31938/live/2.flv" type='video/x-flv'>
</video>
<script>
  //<source src="https://sf1-hscdn-tos.pstatp.com/obj/media-fe/xgplayer_doc_video/flv/xgplayer-demo-720p.flv" type='video/x-flv'>
  // For v5 the tech must be added to the tech order.
  // For v6 this is not needed.
  videojs('videojs-flvjs-player', {
    techOrder: ['html5', 'flvjs'],
    flvjs: {
      mediaDataSource: {
        isLive: true,
        cors: true,
        withCredentials: false,
      },
      // config: {},
    },
  });
</script>
