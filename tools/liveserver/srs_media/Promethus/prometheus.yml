global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node"
    metrics_path: "/metrics"
    scheme: http
    follow_redirects: true
    static_configs:
      - targets: ["10.13.2.11:9100"]

  - job_name: "cadvisor"
    metrics_path: "/metrics"
    scheme: http
    follow_redirects: true
    static_configs:
      - targets: ["10.13.2.11:38080"]

  - job_name: "live_forward"
