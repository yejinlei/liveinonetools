# the config for srs to delivery RTMP
# @see https://github.com/ossrs/srs/wiki/v1_CN_SampleRTMP
# @see full.conf for detail config.

listen              1935;
max_connections     1000;
pid                 ./objs/srs.master.pid;
#srs_log_tank        file;
#srs_log_file        ./objs/srs.master.log;
vhost __defaultVhost__ {
    gop_cache on;
    forward live_srs_rtmp2rtmp:1935 live_srs_rtmp2hls:1935 live_srs_rtmp2httpflv:1935 live_srs_rtmp2hds:1935 live_srs_rtmp2dash:1935 live_srs_rtmp2dvr:1935;
}
