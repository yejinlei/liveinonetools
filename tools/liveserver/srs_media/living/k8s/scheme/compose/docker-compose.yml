version: '3.5'
services:
  vipc:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-vipc:1.0.0
    ports:
      - "8554:8554" #RTSP
      - "8332:8332" #RTSPS
      - "1935:1935" #RTMP
      - "1936:1936" #RTMPS
      - "8888:8888" #HLS
      - "9997:9997" #api
      - "9998:9998" #metrics
      - "9999:9999" #ppof
    volumes:
      - ./rtsp-simple-server.yml:/rtsp-simple-server/rtsp-simple-server.yml 
  push:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-ingest:1.0.0 
    links:
      - vipc
    depends_on:
      - vipc
    volumes:
      - ./argv.conf:/argv.conf:ro
      - ./camera.conf:/camera.conf:ro
