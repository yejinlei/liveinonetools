version: '3.5'
services:
  vipc:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-vipc:1.0.0
    ports:
      - "8554:8554" #RTSP
      - "8332:8332" #RTSPS
      - "1935:1935" #RTMP
      - "1936:1936" #RTMPS
      - "8888:8888" #HLS
      - "9997:9997" #api
      - "9998:9998" #metrics
      - "9999:9999" #ppof
    volumes:
      - ./rtsp-simple-server.yml:/rtsp-simple-server/rtsp-simple-server.yml 
  push:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-ingest:1.0.0 
    links:
      - vipc
    depends_on:
      - vipc
    volumes:
      - ./argv.conf:/argv.conf:ro
      - ./camera.conf:/camera.conf:ro

  live_ingest_ipc:                                                                                                                                                                                                                                                         
    hostname: live_ingest_ipc
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/domain-ingest:1.0.0
    networks:                                                                                                                                                                                                                                                              
      - live-network                                                                                                                                                                                                                                                       
    volumes:                                                                                                                                                                                                                                                            
      - ./ipc_camera.conf:/camera.conf:ro
      - ./ipc_argv.conf:/argv.conf:ro
    deploy:
      mode: replicated
      replicas: 1                                                                                                                                                                                                                                                       
    environment:                                                                                                                                                                                                                                                         
      TASK_SLOT: 1
      SERVICE_NAME: 1
      NODE_HOSTNAME: 1
    command: ./ingest

networks:
  live-network:
    driver: bridge
