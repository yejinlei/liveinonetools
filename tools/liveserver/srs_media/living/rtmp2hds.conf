listen              1935;
max_connections     1000;
http_server {
    enabled         on;
    listen          8180;
    dir             ./objs/nginx/html;
}
vhost __defaultVhost__ {
	hds {
        	enabled         on;
        	hds_fragment    10;
        	hds_window      60;
        	hds_path        ./objs/nginx/html;
	}
}
