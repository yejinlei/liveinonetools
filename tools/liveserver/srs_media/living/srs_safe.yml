version: '3.3'

services:
  live_ingest_loc:
    hostname: live_ingest_loc
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/live_ingest_safe.go:1.0
    secrets:
      - regcode
    privileged: true
    networks:
      - srs-network
    volumes:
      - ./loc_camera.conf:/camera.conf
      - ./loc_argv.conf:/argv.conf
      - /dev/video0:/dev/video0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      TASK_SLOT: 1
      SERVICE_NAME: 1
      NODE_HOSTNAME: 1
      REGCODEFILE: /run/secrets/regcode
    entrypoint:
      - /ingest

  live_ingest_ipc:
    hostname: live_ingest_ipc
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/live_ingest_safe.go:1.0
    secrets:
      - regcode
    privileged: true
    networks:
      - srs-network
    volumes:
      - ./ipc_camera.conf:/camera.conf
      - ./ipc_argv.conf:/argv.conf
    deploy:
      mode: replicated
      replicas: 1
    environment:
      TASK_SLOT: 1
      SERVICE_NAME: 1
      NODE_HOSTNAME: 1
      REGCODEFILE: /run/secrets/regcode
    entrypoint:
      - /ingest

  live_srs_forward:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/srsv2.0-r6_centos7.6_safe:1.2
    secrets:
      - regcode
    privileged: true
    hostname: live_srs_forward
    ports:
      - "11935:1935"
    volumes:
      - ./forward.conf:/usr/local/srs/conf/srs.conf
      - ./server.py:/usr/local/srs/server.py
    networks:
      - srs-network
    deploy:
      mode: replicated
      replicas: 1
    environment:
      REGCODEFILE: /run/secrets/regcode
    working_dir: /usr/local/srs/
    command:
      - ./live_safe

  live_srs_rtmp2rtmp:
    image: registry.cn-hangzhou.aliyuncs.com/yejinlei/srsv2.0-r6_centos7.6_safe:1.2
