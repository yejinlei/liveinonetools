# the config for srs use ffmpeg to transcode
# @see https://github.com/ossrs/srs/wiki/v1_CN_SampleFFMPEG
# @see full.conf for detail config.

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level	    verbose;
http_server {
    enabled         on;
    listen          8180;
    dir             ./dash;
}

vhost __defaultVhost__ {
    transcode {
        enabled     on;
        ffmpeg      ffmpeg;
        engine ff {
            enabled         on;
	    custom          '-i rtmp://live_srs_forward:1935/[app]/[stream] -window_size 5  -min_seg_duration 30000 -single_file 0 -c copy -f dash [stream].mpd';
            vfilter {
            }
            vcodec          copy;
            acodec          copy;
            vparams {
            }
            aparams {
            }
	    #iformat         rtmp://live_srs_forward:1935/[app]/[stream];
	    oformat	    dash;
            output          [stream].mpd;
        }
    }
}
