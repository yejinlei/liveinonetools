listen              1935;
pid                 ./objs/srs.1935.pid;
max_connections     1000;

http_server {
    enabled         on;
    listen          8180;
    dir             ./hls;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_fragment    10;
        hls_window      60;
        hls_path        ./hls;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }
}      
