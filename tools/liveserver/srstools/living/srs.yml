version: '3.3'

services:
  live_ingest_loc:
    hostname: live_ingest_loc
    image: yejinlei/live_ingest.go:1.0
    privileged: true
    networks:
      - srs-network
    volumes:
      - ./loc_camera.conf:/camera.conf
      - ./loc_argv.conf:/argv.conf
      - /dev/video0:/dev/video0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      TASK_SLOT: 1
      SERVICE_NAME: 1
      NODE_HOSTNAME: 1
    entrypoint:
      - ./ingest

  live_ingest_ipc:
    hostname: live_ingest_ipc
    image: yejinlei/live_ingest.go:1.0
    networks:
      - srs-network
    volumes:
      - ./ipc_camera.conf:/camera.conf
      - ./ipc_argv.conf:/argv.conf
    deploy:
      mode: replicated
      replicas: 1
    environment:
      TASK_SLOT: 1
      SERVICE_NAME: 1
      NODE_HOSTNAME: 1
    entrypoint:
      - ./ingest

  live_srs_forward:
    image: yejinlei/srsv2.0-r6_centos7.6:1.2
    hostname: live_srs_forward
    ports:
      - "11935:1935"
    volumes:
      - ./forward.conf:/usr/local/srs/conf/srs.conf
      - ./server.py:/usr/local/srs/server.py
    networks:
      - srs-network
    deploy:
      mode: replicated
      replicas: 1
    command:
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/srs.conf
        python server.py 8085

  live_srs_rtmp2rtmp:
    image: yejinlei/srsv2.0-r6_centos7.6:1.2
