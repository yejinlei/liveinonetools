version: '3.3'

services:
  live_ingest_ipc:
    hostname: live_ingest_ipc
    image: yejinlei/live_ingest.go:0.9
    networks:
      - srs-swarm
    configs:
      - source: IPC_CAMERA
        target: /camera.conf
      - source: IPC_ARGV
        target: /argv.conf
    deploy:
      mode: replicated
      replicas: 1
    environment:
      TASK_SLOT: 1
      SERVICE_NAME: 1
      NODE_HOSTNAME: 1
    command: ./ingest

  live_srs_forward:
    image: yejinlei/srsv2.0-r6_centos7.6:1.2
    hostname: live_srs_forward
    ports:
      - "11935:1935"
    configs:
      - source: FORWARD
        target: /usr/local/srs/conf/srs.conf
      - source: SERVER
        target: /usr/local/srs/server.py
    networks:
      - srs-swarm
    deploy:
      mode: replicated
      replicas: 1 
    command:  
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/srs.conf
        python server.py 8085

  live_srs_rtmp2rtmp:
    image: yejinlei/srsv2.0-r6_centos7.6:1.2
    hostname: live_srs_rtmp2rtmp
    ports:
      - "11936:1935"
    configs:
      - source: RTMP2RTMP
        target: /usr/local/srs/conf/srs.conf
      - source: SERVER
        target: /usr/local/srs/server.py
    networks:
      - srs-swarm
    deploy:
      mode: replicated
      replicas: 1 
    command:  
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/srs.conf
        python server.py 8085

  live_srs_rtmp2hls:
    image: yejinlei/srsv2.0-r6_centos7.6:1.2
    hostname: live_srs_rtmp2hls
    ports:
      - "11937:8180"
    configs:
      - source: RTMP2HLS
        target: /usr/local/srs/conf/srs.conf
      - source: SERVER
        target: /usr/local/srs/server.py
    networks:
      - srs-swarm
    deploy:
      mode: replicated
      replicas: 1 
    command:  
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/srs.conf
        python server.py 8085

  live_srs_rtmp2httpflv:
    image: yejinlei/srsv2.0-r6_centos7.6:1.2
    hostname: live_srs_rtmp2httpflv
    ports:
      - "11938:8180"
    configs:
      - source: RTMP2HTTPFLV
        target: /usr/local/srs/conf/srs.conf
      - source: SERVER
        target: /usr/local/srs/server.py
    networks:
      - srs-swarm
    deploy:
      mode: replicated
      replicas: 1 
    command:  
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/srs.conf
        python server.py 8085

  live_srs_rtmp2hds:
    image: yejinlei/srsv2.0-r6_centos7.6:1.2
    hostname: live_srs_rtmp2hds
    ports:
      - "11939:8180"
    configs:
      - source: RTMP2HDS
        target: /usr/local/srs/conf/srs.conf
      - source: SERVER
        target: /usr/local/srs/server.py
    networks:
      - srs-swarm
    deploy:
      mode: replicated
      replicas: 1 
    command:  
      - /bin/sh
      - -c
      - |
        objs/srs -c conf/srs.conf
        python server.py 8085

configs:
  IPC_CAMERA:
    file: ./ipc_camera.conf
  IPC_ARGV:
    file: ./ipc_argv.conf
  FORWARD:
    file: ./forward.conf
  RTMP2RTMP:
    file: ./rtmp2rtmp.conf
  RTMP2HLS:
    file: ./rtmp2hls.conf
  RTMP2HTTPFLV:
    file: ./rtmp2httpflv.conf
  RTMP2HDS:
    file: ./rtmp2hds.conf
  SERVER:
    file: ./server.py

networks:
  srs-swarm:
    driver: overlay
