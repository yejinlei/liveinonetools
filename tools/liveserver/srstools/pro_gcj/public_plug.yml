version: '3.3'

services:

  zoo1:
    image: zookeeper:3.4.9
    hostname: zoo1
    networks:
      - system-network
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_PORT: 2181
      ZOO_SERVERS: server.1=zoo1:2888:3888
    volumes:
      - /data
      - /datalog

  kafka1:
    image: confluentinc/cp-kafka:5.2.1
    hostname: kafka1
    networks:
      - system-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER_INTERNAL://kafka1:19092,LISTENER_DOCKER_EXTERNAL://10.10.6.210:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER_INTERNAL:PLAINTEXT,LISTENER_DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER_INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - /var/lib/kafka/data
    depends_on:
      - zoo1

  kafka-manager:
    image: sheepkiller/kafka-manager
    environment:
      ZK_HOSTS: zoo1:2181
    networks:
      - system-network
    ports:
      - "9020:9000"
    depends_on:
      - zoo1


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:6.6.1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - /root/zhongsui/liveinone/elk/elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    environment:
      ES_JAVA_OPTS: "-Xmx256m -Xms256m"
    networks:
      - system-network

  kibana:
    image: docker.elastic.co/kibana/kibana-oss:6.6.1
    ports:
      - "5601:5601"
    volumes:
      - /root/zhongsui/liveinone/elk/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - system-network

networks:
  system-network:
    external: true
